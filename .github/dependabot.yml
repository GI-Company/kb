# Dependency updates. Weekly rather than daily on purpose: this is a small
# project and a PR per day per package is noise that gets ignored, which is
# worse than a slower cadence that actually gets read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch and minor bumps for the same package arrive as one PR instead of
    # a dozen. Majors stay separate because they're the ones that need
    # actual review.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    ignore:
      # TypeScript 7 is the native (Go) rewrite, and its programmatic API
      # differs from 5.x. Vercel's build pipeline loads the project's LOCAL
      # TypeScript for its own post-build step, so a 7.x bump fails the
      # deploy with "Cannot read properties of undefined (reading
      # 'readFile')" — after Vite has already built successfully, since Vite
      # transpiles with esbuild rather than tsc. Nothing in this repo is
      # wrong; the constraint is external. Revisit when Vercel supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The workflow below pins actions by major version; this keeps those from
  # silently rotting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
